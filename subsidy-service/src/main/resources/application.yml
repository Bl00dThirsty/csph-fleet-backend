server:
  port: 8089

spring:
  application:
    name: subsidy-service
  datasource:
    url: jdbc:postgresql://localhost:5432/gpl_subsidy_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
