server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  # /actuator/** is served by the gateway itself, not by a route, so
  # JwtAuthenticationFilter (which is attached per-route in GatewayConfig) never
  # sees it. That is deliberate: the readiness probe in Postman and in
  # k8s/scripts/status.ps1 must be able to call it without a token. It exposes
  # no business data — only "UP"/"DOWN" and the registered-service list.
  server:
    port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_FIRST
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Prefixes below are the ONLY ones a controller actually serves. The
        # phantom aliases that used to sit here (clients, regions, drivers,
        # custom-roles, settings, anomalies, reports, pickup-requests,
        # transporter-contracts, rfid-tags, cylinder-movements,
        # inventory-snapshots, vehicle-positions, geofence-events, risk-scores)
        # routed to services that expose no such controller, so they only ever
        # produced a 404 that looked like a missing service.
        #
        # /api/v1/users/** is kept: PersonController is mapped to BOTH
        # /api/v1/persons and /api/v1/users.
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/me/**, /v3/api-docs/auth-service
        - id: organization-service
          uri: lb://organization-service
          predicates:
            - Path=/api/v1/organizations/**, /api/v1/sites/**, /api/v1/classifications/**, /api/v1/organization-relationships/**, /api/v1/client-sites/**, /v3/api-docs/organization-service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/persons/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/permissions/**, /api/v1/groups/**, /v3/api-docs/user-service
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/v1/audit/**, /v3/api-docs/audit-service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/notification-templates/**, /v3/api-docs/notification-service
        - id: tour-service
          uri: lb://tour-service
          predicates:
            # /api/v1/scan-events/** belongs here, NOT to cylinder-service:
            # tour-service's ScanEventController is the one written for the livreur
            # PDA ("les scans sont émis par le PDA embarqué du livreur lors du
            # passage sur un arrêt de tournée") and it is the only one offering
            # POST /bulk for offline resync. cylinder-service serves /api/v1/scans
            # instead, and its controller reads X-User-PersonId rather than
            # X-User-Username. Routing /scan-events to cylinder sent the driver's
            # evidence to a service that cannot accept it.
            - Path=/api/v1/tours/**, /api/v1/checkpoints/**, /api/v1/pickups/**, /api/v1/contracts/**, /api/v1/scan-events/**, /v3/api-docs/tour-service
        - id: cylinder-service
          uri: lb://cylinder-service
          predicates:
            - Path=/api/v1/cylinders/**, /api/v1/rfid/**, /api/v1/scans/**, /v3/api-docs/cylinder-service
        - id: fleet-device-service
          uri: lb://fleet-device-service
          predicates:
            - Path=/api/v1/vehicles/**, /api/v1/devices/**, /api/v1/telemetry/**, /v3/api-docs/fleet-device-service
        - id: subsidy-service
          uri: lb://subsidy-service
          predicates:
            - Path=/api/v1/declarations/**, /api/v1/reconciliations/**, /api/v1/redressements/**, /v3/api-docs/subsidy-service

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 🔐 Auth Service (8081)
        url: /v3/api-docs/auth-service
      - name: 🏢 Organization Service (8082)
        url: /v3/api-docs/organization-service
      - name: 👤 User & Driver Service (8083)
        url: /v3/api-docs/user-service
      - name: 📋 Audit Service (8084)
        url: /v3/api-docs/audit-service
      - name: 🔔 Notification & Anomaly Service (8085)
        url: /v3/api-docs/notification-service
      - name: 🚚 Tour & Pickup Service (8086)
        url: /v3/api-docs/tour-service
      - name: 🏷️ Cylinder & RFID Service (8087)
        url: /v3/api-docs/cylinder-service
      - name: 📡 Fleet & IoT Device Service (8088)
        url: /v3/api-docs/fleet-device-service
      - name: 💰 Subsidy & Reconciliation Service (8089)
        url: /v3/api-docs/subsidy-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

gpl:
  jwt:
    secret: ${GPL_JWT_SECRET:gpl-rfid-livraisons-super-secret-key-change-in-production-2024}
