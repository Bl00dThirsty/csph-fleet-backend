apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tour-service
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tour-service
      containers:
        - name: tour-service
          # tcpSocket, not httpGet: tour-service CONFIGURES
          # management.endpoints.web.exposure.include in its application.yml,
          # but that block is inert without spring-boot-starter-actuator on the
          # classpath, and it is not there. An httpGet probe on
          # /actuator/health would sit in a permanent restart loop. This is the
          # base's reasoning and the prod override must not quietly undo it.
          startupProbe:
            tcpSocket:
              port: 8086
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
