---
# ── 5 (c)  all 10 JVM workloads -> discovery-server ─────────────────────────
# `from` is an empty podSelector, which selects EVERY pod in the namespace
# including mailpit and the databases. That is deliberate: mailpit genuinely
# has no business talking to Eureka, but a narrower selector would be a
# 10-pod-list that has to be edited every time a service is added, and the
# value being protected here (the registry) is not sensitive data.
# Narrow it to a namespaceSelector+podSelector pair if an audit requires it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clients-to-eureka
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8761
---
# ── 6 (e)  mailpit <- notification-service ONLY ─────────────────────────────
# The strictest rule in the file, and the one with the clearest justification:
# the SMTP sink must be reachable from exactly one workload. Any other pod
# that can open a TCP connection to mailpit:1025 can make it relay arbitrary
# mail, and the deployment's own note (k8s/base/mailpit.yaml) records that
# the host ports 1025/8025 are already taken on this machine, so the mapping
# was not chosen carelessly either.
#
# Consequence, stated here so it is not discovered as a surprise: the mailpit
# WEB UI on host port 8026 is NOT reachable under this overlay. It is not in
# allow-kubelet-probes (8025 is not a probe port) and it is not in this rule,
# because this rule is notification-service only. A web UI for a mail sink has
# no business being network-reachable in production. If an operator genuinely
# needs it, add a rule with a source ipBlock restricted to the operator's
# subnet — do not widen this one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-service-to-mailpit
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
      ports:
        - protocol: TCP
          port: 1025
---
# ── 7 (d)  DNS, for everything ─────────────────────────────────────────────
# INERT TODAY, AND THAT IS THE POINT.
#
# Only the INGRESS namespace is default-denied, so egress is currently
# unrestricted and this policy changes nothing. It is here so that adding
#
#     - policyTypes: [Egress]        to default-deny-ingress
#
# later is a one-line change rather than an outage. Without it, enabling
# egress default-deny black-holes DNS and every hostname lookup in the
# platform fails at once — including `discovery-server` and `postgres-user`,
# which are reached BY NAME, not by IP.
#
# The namespaceSelector on kube-system plus the label on the pod is the
# portable way to find the DNS service; `kube-dns` in some distributions and
# `coredns` in others, so the pod label `k8s-app=kube-dns` is used rather than
# a name. Both TCP and UDP 53 are listed because a large response falls back
# from UDP to TCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
