# ═══════════════════════════════════════════════════════════════════════════
# dev-only pod annotations.
#
# Applied to every Deployment in the base (see kustomization.yaml: patches with
# target kind=Deployment). Strategic-merge, so one document per workload is
# required — a patch without metadata.name cannot be applied through a target.
#
# `csph.gpl.dev/log-hint` puts the exact `kubectl logs` command for that
# workload on the pod, which is what you actually want at 2am when the
# gateway is returning 503 and you are grepping nine Deployments by hand.
# Nothing here changes runtime behaviour: no image, no replica count, no
# resources, no probe. The base already pins imagePullPolicy=IfNotPresent, so
# there is no pull-policy patch to make either.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
spec:
  template:
    metadata:
      annotations:
        csph.gpl.dev/environment: "dev"
        csph.gpl.dev/log-hint: "kubectl logs -n csph-gpl deploy/discovery-server --tail=200 -f"
---
