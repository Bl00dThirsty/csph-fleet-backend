# ═══════════════════════════════════════════════════════════════════════════
# Credentials for the dev cluster.
#
# DEV-ONLY: `stringData` (plain text) is used on purpose, per the platform
# convention — these are the throwaway local credentials that the legacy
# docker-compose.yml already committed in clear text. Nothing here is reused
# outside the kind node. For any real cluster, seal these with SealedSecrets /
# External Secrets / SOPS and drop this file.
#
# There are exactly two Secrets because they have two different audiences:
#   postgres-credentials  -> consumed by the 9 Postgres StatefulSets only
#                            (POSTGRES_* is the image's own contract)
#   gpl-app-credentials   -> consumed by the 10 JVM Deployments
#                            (Spring Boot reads SPRING_DATASOURCE_* and
#                             GPL_JWT_SECRET)
#
# GPL_JWT_SECRET lives in a single Secret referenced by both api-gateway and
# auth-service, so the signing/verifying pair can never drift apart.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres-credentials
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: gpl-app-credentials
  labels:
    app.kubernetes.io/name: gpl-app-credentials
    app.kubernetes.io/component: application
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  # MUST be byte-identical in api-gateway (JwtAuthenticationFilter signs) and
  # auth-service (JwtService signs). Same value as the application.yml default
  # and the docker-compose.yml default, so existing tokens stay valid.
  GPL_JWT_SECRET: gpl-rfid-livraisons-super-secret-key-change-in-production-2024
