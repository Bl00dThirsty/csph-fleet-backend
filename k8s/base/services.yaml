# ───────────────────────────────────────────────────────────────────────────
# notification-service — 8085 — postgres-notif/gpl_notification_db
#
# The SPRING_MAIL_* block points SMTP at the in-cluster MailHog instead of
# smtp.gmail.com:587. smtp.auth/starttls must both go false: MailHog accepts
# anything, so leaving them on makes JavaMail try to AUTH/STARTTLS against a
# server that speaks neither and /api/v1/notifications/** returns 500 on send.
# The password/username values are ignored by MailHog but JavaMail still wants
# them present when auth is on, so they are kept for symmetry.
# ───────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: application
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-notif:5432/gpl_notification_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
  # The gateway forwards the caller's full permission set as the
  # X-User-Permissions request header. With permissions correctly seeded there
  # are 187 codes, which is ~5 KB -- over Tomcat's 8 KB default
  # max-http-request-header-size, so every gateway request failed with a bare
  # 400 "Request header is too large". Raise the ceiling to 64 KB.
  SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: "65536"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_MAIL_HOST: "mailhog"
  SPRING_MAIL_PORT: "1025"
  SPRING_MAIL_USERNAME: "mailhog"
  SPRING_MAIL_PASSWORD: "mailhog"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: application
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: csph/gpl-notification-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jvm-common
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: gpl-app-credentials
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 20
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          resources:
            requests:
              cpu: 400m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
