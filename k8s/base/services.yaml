# ═══════════════════════════════════════════════════════════════════════════
# The 9 Spring Boot microservices.
#
# Per service: 1 ConfigMap (non-secret config) + 1 Deployment + 1 ClusterIP
# Service (in-cluster, and the DNS name Eureka/gateway use) + 1 NodePort
# Service (host access on the fixed nodePort from k8s/kind-cluster.yaml).
# Two Services again because a Service has exactly one `type`.
#
# PROBE DECISION — tcpSocket for all nine, not one single httpGet:
#   the actuator starter is on the classpath of NONE of these modules. The only
#   pom.xml that declares spring-boot-starter-actuator is discovery-server's;
#   the parent pom contributes only Lombok, and neither
#   spring-cloud-starter-netflix-eureka-client nor
#   spring-cloud-starter-gateway pulls actuator in transitively. Without the
#   starter there is no /actuator endpoint, so an httpGet probe would sit in
#   CrashLoopBackOff forever. tour-service is the trap: it *configures*
#   management.endpoints.web.exposure.include in its application.yml, but that
#   block is inert without the starter — hence tcpSocket there too.
#   tcpSocket is the honest liveness signal anyway: it proves Netty/Tomcat has
#   bound the port, which is exactly what "is this replica able to serve" means
#   to the gateway. Readiness is given a long initial delay and a high failure
#   threshold because these pods start against a database and a Eureka server
#   that are not up yet — Kubernetes, not an initContainer, sequences this.
#
#   (t2 discovery-server, which really does have actuator, uses httpGet — see
#   discovery.yaml.)
#
# Every pod gets three envFrom sources:
#   jvm-common          JAVA_TOOL_OPTIONS (see jvm-config.yaml)
#   <svc>-config        the overrides below, all of them beating the localhost
#                       defaults hard-coded in the module's application.yml
#   gpl-app-credentials SPRING_DATASOURCE_PASSWORD + GPL_JWT_SECRET
#                       (SPRING_DATASOURCE_USERNAME is repeated in the
#                       ConfigMap on purpose: it is not a secret and keeping it
#                       visible here documents the credential set)
#
# EUREKA_INSTANCE_PREFER_IP_ADDRESS=true is not in any application.yml except
# tour-service's, and it is required: without it a Eureka client registers its
# pod *hostname* (the pod name), which no other pod can resolve, and every
# `lb://auth-service` route in api-gateway would 503 with "no instances
# available". Registering the pod IP makes the registry directly routable.
#
# SPRING_PROFILES_ACTIVE=dev turns the @Profile({"dev","test","local","default"})
# seeders (AuthDataInitializer, DataInitializer, UserDataInitializer,
# RolesPermissionsInitializer, TourDataInitializer) on explicitly and
# deterministically, instead of relying on the absence of any profile.
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────
# auth-service — 8081 — postgres-auth/gpl_auth_db
# Signs the JWTs that api-gateway's JwtAuthenticationFilter verifies, so it
# shares gpl-app-credentials with the gateway.
# ───────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: application
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-auth:5432/gpl_auth_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
  # The gateway forwards the caller's full permission set as the
  # X-User-Permissions request header. With permissions correctly seeded there
  # are 187 codes, which is ~5 KB -- over Tomcat's 8 KB default
  # max-http-request-header-size, so every gateway request failed with a bare
  # 400 "Request header is too large". Raise the ceiling to 64 KB.
  SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: "65536"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: application
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: csph/gpl-auth-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jvm-common
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: gpl-app-credentials
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 20
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          resources:
            requests:
              cpu: 400m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-nodeport
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: application
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
      protocol: TCP

