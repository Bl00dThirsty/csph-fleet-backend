# ═══════════════════════════════════════════════════════════════════════════
# The 9 Postgres databases, one StatefulSet each — one per bounded context, so
# a schema change in fleet-device-service can never take auth down with it.
#
#   StatefulSet        database           in-cluster port   host port / nodePort
#   -----------------  -----------------  ----------------  --------------------
#   postgres-auth      gpl_auth_db        5432              5500 / 25500
#   postgres-org       gpl_organization_db 5432             5501 / 25501
#   postgres-user      gpl_user_db        5432              5502 / 25502
#   postgres-audit     gpl_audit_db       5432              5503 / 25503
#   postgres-notif     gpl_notification_db 5432             5504 / 25504
#   postgres-tour      gpl_tour_db        5432              5505 / 25505
#   postgres-fleet     gpl_fleet_db       5432              5506 / 25506
#   postgres-cylinder  gpl_cylinder_db    5432              5507 / 25507
#   postgres-subsidy   gpl_subsidy_db     5432              5508 / 25508
#
# THREE Services per database, because a Service has exactly one `type`:
#   <name>-headless  clusterIP: None  -> StatefulSet serviceName, stable
#                                        per-pod DNS (…-0.<name>-headless)
#   <name>           ClusterIP        -> what the Spring configs dial:
#                                        jdbc:postgresql://postgres-auth:5432/…
#   <name>-nodeport  NodePort         -> host inspection via psql/DBeaver, on
#                                        the fixed 25500-25508 nodePorts that
#                                        k8s/kind-cluster.yaml maps to host
#                                        ports 5500-5508 (5432/5433 are taken
#                                        by a native Windows Postgres)
#
# The in-cluster Service is named exactly like the StatefulSet; the headless
# Service therefore carries the -headless suffix instead. The Spring
# application.yml files reference `postgres-<x>:5432`, so that name is the one
# that must not change.
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────
# postgres-auth — gpl_auth_db
# ───────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth-headless
  labels:
    app.kubernetes.io/name: postgres-auth
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres-auth
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  labels:
    app.kubernetes.io/name: postgres-auth
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-auth
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth-nodeport
  labels:
    app.kubernetes.io/name: postgres-auth
    app.kubernetes.io/component: database
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres-auth
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30093
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth
  labels:
    app.kubernetes.io/name: postgres-auth
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-auth-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-auth
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: POSTGRES_DB
              value: gpl_auth_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - gpl_auth_db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - gpl_auth_db
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
            successThreshold: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres-auth
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi

