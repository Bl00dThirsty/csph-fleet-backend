# ───────────────────────────────────────────────────────────────────────────
# postgres-fleet — gpl_fleet_db
#
# The only TimescaleDB instance: fleet-device-service writes vehicle-position
# and telemetry time series. Same protocol and same credentials as the other
# eight, so the Service layout is identical.
#   * TS_TELEMETRY=off — no phone-home from inside the cluster.
#   * /dev/shm as tmpfs — TimescaleDB needs more POSIX shared memory than the
#     64Mi Docker default, otherwise parallel workers die with
#     "could not resize shared memory segment".
# ───────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-fleet-headless
  labels:
    app.kubernetes.io/name: postgres-fleet
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres-fleet
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-fleet
  labels:
    app.kubernetes.io/name: postgres-fleet
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-fleet
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-fleet-nodeport
  labels:
    app.kubernetes.io/name: postgres-fleet
    app.kubernetes.io/component: database
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres-fleet
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30099
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-fleet
  labels:
    app.kubernetes.io/name: postgres-fleet
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-fleet-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-fleet
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: timescale/timescaledb-ha:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: POSTGRES_DB
              value: gpl_fleet_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TS_TELEMETRY
              value: "off"
