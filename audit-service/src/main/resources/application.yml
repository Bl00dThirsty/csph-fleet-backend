server:
  port: 8084

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/gpl_audit_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
