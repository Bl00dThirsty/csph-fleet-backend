$kind: http-request
name: GET /redressements
description: |-
  Redressements - the financial penalty a marketer owes when tracked volume falls short of declared volume. The last
  link in the chain: declaration -> reconciliation -> redressement -> payment.

  Enveloped `PageResponse`, filterable by `reconciliationId` and `status`.
url: "{{gateway}}/api/v1/redressements?size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 14000
