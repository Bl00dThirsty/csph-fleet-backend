$kind: http-request
name: POST /redressements/{redressementId}/pay?transactionRef=
description: |-
  Records payment of the penalty. `transactionRef` is an **optional** query parameter, but a redressement marked paid
  with no bank reference is unauditable, so one is always supplied - carrying `{{uniq}}` to keep re-runs distinct.

  `{{uniq}}` is regenerated per request, so this reference differs from the one sent at creation. That is harmless: the
  two are independent columns, and the payment reference is the authoritative one.
url: "{{gateway}}/api/v1/redressements/{{redressementId}}/pay?transactionRef=TX-{{uniq}}"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  transactionRef: TX-{{uniq}}
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('pay rejected by the redressement state machine -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 17000
