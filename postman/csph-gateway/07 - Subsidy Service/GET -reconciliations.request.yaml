$kind: http-request
name: GET /reconciliations
description: |-
  Reconciliations - the regulator''s measured answer to the marketer''s claim. Enveloped `PageResponse`, filterable by
  `declarationId` and `status` (`PENDING`, `VERIFIED`, `REDRESSEMENTAPPLIED`).

  One reconciliation per declaration (`reconciliations.declaration_id` is `UNIQUE`), which is why the by-declaration
  route below can 404 for a declaration that has not been reconciled yet.
url: "{{gateway}}/api/v1/reconciliations?size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 9000
