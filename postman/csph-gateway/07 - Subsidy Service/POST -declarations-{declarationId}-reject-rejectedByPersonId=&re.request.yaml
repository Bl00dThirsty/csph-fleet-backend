$kind: http-request
name: POST /declarations/{declarationId}/reject?rejectedByPersonId=&reason=
description: |-
  Rejects the declaration, routing it to `DISPUTED`. Both query parameters are optional.

  Because the request above already tried to approve it, this is **expected to be rejected** - and that is the point
  of the test. A declaration that accepted both `approve` and `reject` would mean the state machine is not enforced,
  which is a much more serious finding than a red test here.
url: "{{gateway}}/api/v1/declarations/{{declarationId}}/reject?rejectedByPersonId={{personId}}&reason=Volume%20exceeds%20the%20tracked%20trajectory"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  rejectedByPersonId: "{{personId}}"
  reason: Volume%20exceeds%20the%20tracked%20trajectory
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('reject rejected - the declaration was already approved -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 8000
