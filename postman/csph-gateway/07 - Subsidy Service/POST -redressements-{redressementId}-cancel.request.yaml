$kind: http-request
name: POST /redressements/{redressementId}/cancel
description: |-
  Cancels the penalty - used when the reconciliation itself is overturned on appeal. No body, no parameters.

  Runs after `pay`, so cancelling a paid redressement is correctly refused. Same reasoning as the declaration
  `reject` step: a resource that accepted both would mean the state machine is decorative.
url: "{{gateway}}/api/v1/redressements/{{redressementId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('cancel rejected - the redressement was already paid -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 18000
