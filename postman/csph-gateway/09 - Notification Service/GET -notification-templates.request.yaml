$kind: http-request
name: GET /notification-templates
description: |-
  The whole template catalogue. Enveloped **array** (not a `PageResponse` - the catalogue is small and never paged).

  `language` is part of the template, so a French and an English variant are two distinct rows with two distinct
  codes; the catalogue is therefore the place to check whether a translation actually exists before debugging a
  "notification in the wrong language" report.
url: "{{gateway}}/api/v1/notification-templates"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 2000
