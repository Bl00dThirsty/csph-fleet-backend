$kind: http-request
name: GET /audit/modifications?entityType=&entityId=&page=0&size=20
description: |-
  Field-level change history. Enveloped `ApiResponse<PageResponse<EntityModificationResponse>>` - enveloped, unlike the
  bare lists elsewhere.

  `entityType` and `entityId` are optional filters, bound through an `AuditQueryParams` `@ModelAttribute`; `page` and
  `size` default to `0` / `20`. `actorPersonId`, `action`, `module`, `dateFrom` and `dateTo` are also available and
  simply not exercised here.

  A row here is one entity modification, whose nested `changes` list is the individual before/after field pairs - the
  granularity a GPL audit actually requires.
url: "{{gateway}}/api/v1/audit/modifications?entityType=ORGANIZATION&entityId={{orgId}}&page=0&size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  entityType: ORGANIZATION
  entityId: "{{orgId}}"
  page: "0"
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 1000
