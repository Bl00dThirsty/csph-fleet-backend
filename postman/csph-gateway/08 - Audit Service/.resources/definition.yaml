$kind: collection
description: |-
  audit-service on :8084, reached through `{{gateway}}/api/v1`.

  Read side: `/modifications` (field-level), `/status-history` (status transitions), `/summary/{entityType}/{entityId}`
  (per-entity counts). Write side: `/ingest`, which takes a **raw** `AuditEvent` rather than an enveloped request.

  All three reads are **enveloped** `PageResponse`s, so this folder is consistent with itself even though the rest of
  the platform is not.
scripts:
  - type: http:beforeRequest
    code: |-
      if (!pm.collectionVariables.get('accessToken')) {
          console.warn('No accessToken yet - run 01 - Auth > POST /api/v1/auth/login first. Expect 401s.');
      }
    language: text/javascript
order: 11000
