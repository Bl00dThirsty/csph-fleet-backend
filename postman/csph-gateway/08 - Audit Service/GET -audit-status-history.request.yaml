$kind: http-request
name: GET /audit/status-history
description: |-
  The status-change journal - who moved which entity from which status to which, and when. Enveloped `PageResponse`.

  Same `AuditQueryParams` binding as `/modifications`, so the same filters apply. Kept separate from `/modifications`
  because status transitions are the queries regulators ask for by name, and they are indexed differently.
url: "{{gateway}}/api/v1/audit/status-history?page=0&size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  page: "0"
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 2000
