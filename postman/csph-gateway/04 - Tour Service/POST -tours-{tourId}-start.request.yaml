$kind: http-request
name: POST /tours/{tourId}/start
description: |-
  Lifecycle transition `DRAFT -> IN_PROGRESS` (the tour service reuses the `PickupStatus` vocabulary). `startedAt` is
  stamped server-side.

  Starting a tour twice is a state-machine error, so this request sits between the assignment steps and the
  checkpoint steps - running the folder top to bottom keeps it in a legal state.
url: "{{gateway}}/api/v1/tours/{{tourId}}/start"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('start rejected by the tour state machine -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 8000
