$kind: http-request
name: GET /contracts/by-marketer/{marketerOrganizationId}
description: |-
  Contracts grouped by marketer - a convenience route returning `ApiResponse<List<...>>` (a plain array, not a
  `PageResponse`), for the "who can this marketer dispatch with?" panel in the frontend.

  Note the route ordering: `/{id}` would happily swallow `by-marketer` if it were declared first and Spring resolved
  greedily, so the literal segment is declared ahead of the `{id}` template in the controller.
url: "{{gateway}}/api/v1/contracts/by-marketer/{{marketerOrgId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 22000
