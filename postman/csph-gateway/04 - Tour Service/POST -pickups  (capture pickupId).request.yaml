$kind: http-request
name: POST /pickups  (capture pickupId)
description: |-
  `CreatePickupRequestDto` requires `marketerOrganizationId`, `sourceSiteId` and `destinationSiteId`; `requestedQuantity`
  is `@Min(1)`. The two site ids are the depot leaving and the site arriving - the physical twin of a tour.

  All three ids were captured in folder `02`. `siteIdDest` falls back to `siteId` when the database has only one site,
  so this request still succeeds on a minimal install.
url: "{{gateway}}/api/v1/pickups"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: |-
    {
      "marketerOrganizationId": "{{marketerOrgId}}",
      "sourceSiteId": "{{siteId}}",
      "destinationSiteId": "{{siteIdDest}}",
      "requestedQuantity": 12.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200/201 created', function () { pm.expect(pm.response.code).to.be.oneOf([200, 201]); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('pickupId captured (UUID)', function () {
          pm.expect(j.data.id).to.match(/^[0-9a-f-]{36}$/i);
          pm.collectionVariables.set('pickupId', j.data.id);
      });
    language: text/javascript
order: 17000
