$kind: http-request
name: GET /pickups
description: |-
  Pickup requests - the demand side of a tour, raised by a marketer for stock at a depot. Enveloped `PageResponse`,
  filterable by `marketerOrganizationId`, `sourceSiteId` and `status`.

  Lifecycle: `DRAFT -> VALIDATED -> INPROGRESS -> COMPLETED` (or `CANCELLED`). The `approve` / `reject` pair below is
  how a CSPH agent validates demand; approval needs the approved quantity, which is a **required** query parameter.
url: "{{gateway}}/api/v1/pickups?size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 16000
