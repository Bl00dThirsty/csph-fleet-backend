$kind: http-request
name: PATCH /pickups/{pickupId}/approve?approvedQuantity=  (approvedQuantity REQUIRED)
description: |-
  **`approvedQuantity` is a REQUIRED query parameter** and is a primitive `double` - omitting it 400s, and so does
  sending a non-numeric value.

  11 is deliberately one short of the 12 requested: CSPH agents routinely authorise less than a marketer asks for,
  and the difference is the audit trail that the subsidy workflow later reconciles.
url: "{{gateway}}/api/v1/pickups/{{pickupId}}/approve?approvedQuantity=11"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  approvedQuantity: "11"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('approve rejected by the pickup state machine -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 18000
