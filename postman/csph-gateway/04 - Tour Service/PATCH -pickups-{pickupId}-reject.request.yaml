$kind: http-request
name: PATCH /pickups/{pickupId}/reject
description: |-
  Rejects the request. No body, **no parameters at all** - a bare PATCH, so it is trivially easy to call.

  Runs after `approve` in the folder, so the pickup is already validated and rejection is correctly refused by the
  state machine. That refusal is the assertion here: it proves the lifecycle is actually enforced rather than
  accepting any transition.
url: "{{gateway}}/api/v1/pickups/{{pickupId}}/reject"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('reject rejected by the pickup state machine -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 19000
