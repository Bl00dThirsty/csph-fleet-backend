$kind: http-request
name: GET /checkpoints/{checkpointId}
description: |-
  Single stop, enveloped. Note the route shape: checkpoints are addressed **flat** (`/api/v1/checkpoints/{id}`) for
  single-stop operations, and **nested** (`/api/v1/tours/{tourId}/checkpoints`) for listing and creation. Both exist in
  `CheckpointController`.
url: "{{gateway}}/api/v1/checkpoints/{{checkpointId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('id matches the path variable', function () { pm.expect(j.data.id).to.eql(pm.collectionVariables.get('checkpointId')); });
      pm.test('belongs to this tour', function () {
          pm.expect(j.data.tourId).to.eql(pm.collectionVariables.get('tourId'));
      });
    language: text/javascript
order: 11000
