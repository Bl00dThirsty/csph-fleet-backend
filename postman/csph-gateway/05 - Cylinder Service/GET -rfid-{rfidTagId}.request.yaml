$kind: http-request
name: GET /rfid/{rfidTagId}
description: |-
  By **primary key**. Compare the `/rfid/tag/{tagUid}` route below, which is the same resource addressed by its EPC -
  the same two-identifier pattern as `persons/{id}` vs `persons/by-person-id/{key}` in folder `03`.
url: "{{gateway}}/api/v1/rfid/{{rfidTagId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('id matches the path variable', function () { pm.expect(j.data.id).to.eql(pm.collectionVariables.get('rfidTagId')); });
    language: text/javascript
order: 8000
