$kind: http-request
name: GET /rfid  (BARE PageResponse)
description: |-
  RFID tags. **Bare `PageResponse`**, filterable by `tagUid`, `bottleSerial`, `currentSiteId`, `status`, sorted
  `createdAt DESC`.

  A tag is the physical identity; a bottle is the asset. `rfid_tags.current_site_id` and `current_client_site_id` are
  mutually exclusive by a check constraint - a tag is either at an operational site or at a client site, never both.
  That same constraint is why the checkpoint body in folder `04` must pick one field and not both.

  `status` follows `RfidTagStatus`: `AVAILABLE`, `ASSIGNEDTOBOTTLE`, `INTRANSITOUT`, `INTRANSITIN`, `LOST`, `BLOCKED`.
url: "{{gateway}}/api/v1/rfid?size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const d = pm.response.json();
      pm.test('BARE PageResponse - no success envelope', function () {
          pm.expect(d).to.be.an('object');
          pm.expect(d).to.not.have.property('success');
      });
      pm.test('page metadata present', function () {
          pm.expect(d).to.have.property('totalCount');
          pm.expect(d).to.have.property('pageNumber');
      });
      const items = d.content || d.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 6000
