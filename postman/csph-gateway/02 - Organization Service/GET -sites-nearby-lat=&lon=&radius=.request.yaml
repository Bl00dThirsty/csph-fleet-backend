$kind: http-request
name: GET /sites/nearby?lat=&lon=&radius=
description: |-
  Geo query around Douala (3.848 N, 11.502 E) within 50 km - the CSPH operating area.

  All three parameters are **required** and declared as primitive `double`, not boxed `Double`, so a missing one is a
  400 `MissingServletRequestParameterException` rather than a null that gets filtered out.

  Enveloped **array** (`ApiResponse<List<SiteSummaryResponse>>`). An empty result within 50 km of Douala just means
  no depot has been geocoded yet - not a failure.
url: "{{gateway}}/api/v1/sites/nearby?lat=3.848&lon=11.502&radius=50"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  lat: "3.848"
  lon: "11.502"
  radius: "50"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });console.log('sites within 50km of Douala:', j.data.length);
    language: text/javascript
order: 10000
