$kind: http-request
name: GET /organizations/{orgId}/children
description: |-
  Direct children in the organization tree. Enveloped **array** (`ApiResponse<List<OrganizationSummaryResponse>>`),
  not a paged object - three shapes in one controller: bare page, enveloped object, enveloped array.

  On the throwaway org created two requests ago this is legitimately `[]`. The assertion accepts an empty array; a
  non-array would mean the endpoint changed shape.
url: "{{gateway}}/api/v1/organizations/{{orgId}}/children"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });console.log('children:', j.data.length);
    language: text/javascript
order: 6000
