$kind: http-request
name: GET /classifications
description: |-
  The class-structure taxonomy (`class_structures`) used to classify organizations.

  Read-only - `ClassStructureController` declares a single `GET`, no POST/PUT. It is reference data, which is why
  there is no create step for it anywhere in this suite.
url: "{{gateway}}/api/v1/classifications"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 16000
