$kind: http-request
name: GET /api/v1/me/permissions
description: |-
  The end-to-end proof that the gateway header pipeline works end to end: auth-service resolves the permissions from
  user-service at login, bakes them into the JWT, the gateway lifts them back out into `X-User-Permissions`, and this
  endpoint does nothing but split that header on commas.

  If this is `[]` while the login JWT claim was non-empty, the `JwtAuthenticationFilter` is not running.
url: "{{gateway}}/api/v1/me/permissions"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
      pm.test('permissions non-empty', function () { pm.expect(j.data.length).to.be.above(0); });
      console.log('gateway-injected permissions (' + j.data.length + '):', j.data.join(', '));
    language: text/javascript
order: 4000
