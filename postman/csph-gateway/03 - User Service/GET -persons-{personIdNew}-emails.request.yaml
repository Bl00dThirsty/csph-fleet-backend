$kind: http-request
name: GET /persons/{personIdNew}/emails
description: |-
  Email sub-resource - the counterpart of `/phones`. Enveloped **array**.

  Email matters well beyond the UI: notification-service resolves a recipient through `recipientPersonId`, and any
  `EMAIL`-channel send needs a resolvable address. A person with no `emails` row cannot be notified at all.
url: "{{gateway}}/api/v1/persons/{{personIdNew}}/emails"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });pm.test('the email we created is present', function () { pm.expect(j.data.length).to.be.above(0); });
    language: text/javascript
order: 10000
