$kind: http-request
name: GET /persons/{personIdNew}/phones
description: |-
  Phone sub-resource, projected server-side (`personService.getPerson(id).getPhones()`). Enveloped **array**.

  Returns the `phones` array sent in the `POST /persons/` body a few requests up, so the assertion checks the
  round-trip rather than only the shape.
url: "{{gateway}}/api/v1/persons/{{personIdNew}}/phones"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });pm.test('the phone we created is present', function () { pm.expect(j.data.length).to.be.above(0); });
    language: text/javascript
order: 9000
