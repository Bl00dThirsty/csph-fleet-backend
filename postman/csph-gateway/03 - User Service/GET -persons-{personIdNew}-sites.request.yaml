$kind: http-request
name: GET /persons/{personIdNew}/sites
description: |-
  Site assignments (`UserSiteAssignment`) - the second half of the dual-layer RBAC: a person gets **roles** (what they
  may do) and **sites** (where they may do it). Data-visibility filtering is built on the site assignments, not on
  the roles, so a person with roles but no sites is functionally blind.

  Empty before the POST below, which uses the `siteId` captured in folder `02`.
url: "{{gateway}}/api/v1/persons/{{personIdNew}}/sites"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 13000
