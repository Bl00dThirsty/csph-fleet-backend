$kind: http-request
name: GET /persons/{personIdNew}/permissions  (effective, resolved)
description: |-
  The **effective** permission set for the person, flattened from every granted role by
  `PermissionService.resolvePermissions(personId)`.

  This is the exact call `AuthService` makes at login to build the JWT `permissions` claim - so running it on any
  person tells you exactly what that person's next login token will contain, without having to log in as them.

  A `Set<String>` serialises as a JSON **array**, hence the array assertion (and not a `PageResponse`).
url: "{{gateway}}/api/v1/persons/{{personIdNew}}/permissions"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array (Set<String> serialises as an array)', function () { pm.expect(j.data).to.be.an('array'); });
      console.log('effective permissions for the new person (' + j.data.length + '):', j.data.join(', '));
    language: text/javascript
order: 15000
