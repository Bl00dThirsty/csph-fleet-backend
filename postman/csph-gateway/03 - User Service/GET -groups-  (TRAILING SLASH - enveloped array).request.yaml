$kind: http-request
name: GET /groups/  (TRAILING SLASH - enveloped array)
description: |-
  User groups - permission bundles used for a bulk grant instead of per-person role assignment. Enveloped **array**,
  trailing slash required.

  `GroupResponse.memberCount` is maintained denormalised on the row, so this list is the cheapest way to see group
  sizes without an N+1 storm of member calls.
url: "{{gateway}}/api/v1/groups/"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 23000
