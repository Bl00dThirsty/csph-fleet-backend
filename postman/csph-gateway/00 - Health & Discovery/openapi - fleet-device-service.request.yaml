$kind: http-request
description: |-
  Aggregated OpenAPI document for fleet-device-service (:8088 - vehicles, IoT devices, telemetry), re-exposed by the gateway at /v3/api-docs/fleet-device-service.

  /v3/api-docs is in JwtAuthenticationFilter.OPEN_ENDPOINTS, so no token is required. info.title proves springdoc
  is enabled inside the downstream service (not just at the gateway).
url: "{{gateway}}/v3/api-docs/fleet-device-service"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('info.title present', function () { pm.expect(j.info.title).to.be.a('string'); });
      pm.test('paths documented', function () { pm.expect(Object.keys(j.paths || {}).length).to.be.above(0); });
    language: text/javascript
order: 11000
