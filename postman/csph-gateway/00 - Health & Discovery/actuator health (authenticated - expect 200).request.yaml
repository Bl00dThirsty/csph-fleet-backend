$kind: http-request
name: actuator health (authenticated -> expect 200)
description: |-
  Run this **after** `01 - Auth > POST /api/v1/auth/login`. With a valid bearer token the gateway JWT filter lets the
  request through and the actuator answers a hard **200** with `{"status":"UP"}`.
url: "{{gateway}}/actuator/health"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      pm.test('a token was captured (run 01 - Auth first)', function () {
          pm.expect(pm.collectionVariables.get('accessToken')).to.be.a('string').and.to.have.length.above(0);
      });
      const h = pm.response.json();
      pm.test('health status UP', function () { pm.expect(h.status).to.eql('UP'); });
    language: text/javascript
order: 2000
