$kind: http-request
name: PUT /vehicles/{vehicleId}
description: |-
  Updates the truck''s specification and status. `status: MAINTENANCE` is the interesting part - a truck in the
  workshop must not be assignable to a tour, and this is the request that would put it in that state before anyone
  tries.
url: "{{gateway}}/api/v1/vehicles/{{vehicleId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: |-
    {
      "licensePlate": "LT-{{uniq}}",
      "type": "VRAC",
      "organizationId": "{{transporterOrgId}}",
      "maxVolume": 15.0,
      "maxBottleCount": 24,
      "certificateNumber": "CERT-{{uniq}}",
      "tareWeight": 4400.0,
      "isActive": true,
      "status": "MAINTENANCE",
      "statusDescription": "Sent to the workshop by the csph-gateway Postman collection"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('maxVolume updated', function () { pm.expect(j.data.maxVolume).to.eql(15.0); });
      pm.test('status is MAINTENANCE', function () { pm.expect(j.data.status).to.eql('MAINTENANCE'); });
    language: text/javascript
order: 4000
