$kind: http-request
name: GET /devices
description: |-
  IoT devices - GPS trackers, PDA handhelds and RFID readers (`DeviceType`: `GPS`, `PDA`, `RFIDREADER`), each
  optionally assigned to a person or a vehicle.

  Filterable by `organizationId`, `deviceType`, `status`. Enveloped `PageResponse`, like `/vehicles` in the same
  service.
url: "{{gateway}}/api/v1/devices?size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });if (items[0]) { pm.collectionVariables.set('deviceId', items[0].id); }
    language: text/javascript
order: 5000
