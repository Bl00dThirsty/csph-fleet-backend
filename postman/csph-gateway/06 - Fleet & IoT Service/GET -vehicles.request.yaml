$kind: http-request
name: GET /vehicles
description: |-
  Trucks. Enveloped `ApiResponse<PageResponse<VehicleResponse>>` - note this service uses the **dotted lower-case**
  permission style (`fleet.vehicles.read`, `fleet.vehicles.create`, `fleet.vehicles.manage`) while organization, user
  and tour services use UPPER_SNAKE. Both live in the same `permissions` table.

  Also supports `sortBy` / `sortDir`, which the other list endpoints do not - the fleet service is the only one with a
  server-side sort contract.
url: "{{gateway}}/api/v1/vehicles?size=20"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });if (items[0]) { pm.collectionVariables.set('vehicleId', items[0].id); }
    language: text/javascript
order: 1000
