$kind: http-request
name: GET /vehicles/{vehicleId}
description: |-
  Single truck, enveloped. `certificateExpiryAt` is the compliance field: an expired certificate is what a CSPH
  inspection actually checks, and the platform surfaces it here rather than only in a report.
url: "{{gateway}}/api/v1/vehicles/{{vehicleId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
  X-User-PersonId: "{{personId}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('id matches the path variable', function () { pm.expect(j.data.id).to.eql(pm.collectionVariables.get('vehicleId')); });
    language: text/javascript
order: 3000
