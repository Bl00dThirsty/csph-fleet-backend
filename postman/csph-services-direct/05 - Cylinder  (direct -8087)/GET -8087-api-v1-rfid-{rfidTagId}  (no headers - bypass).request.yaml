$kind: http-request
name: GET :8087/api/v1/rfid/{rfidTagId}  (no headers - bypass)
description: |-
  **cylinder-service on :8087**, no security headers, so `RFID_VIEW` is bypassed.

  By **primary key**. The sibling route `/rfid/tag/{tagUid}` addresses the same resource by EPC - which is how a
  handheld reader asks "what is this?", never "what is the id of the row whose id I already know".
url: "{{cylinderService}}/api/v1/rfid/{{rfidTagId}}"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('id matches the path variable', function () { pm.expect(j.data.id).to.eql(pm.collectionVariables.get('rfidTagId')); });
    language: text/javascript
order: 7000
