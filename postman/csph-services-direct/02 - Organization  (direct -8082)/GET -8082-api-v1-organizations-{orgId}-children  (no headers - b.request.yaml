$kind: http-request
name: GET :8082/api/v1/organizations/{orgId}/children  (no headers - bypass)
description: |-
  **organization-service on :8082**, no security headers, so `ORG_VIEW` is bypassed.

  Enveloped **array** (`ApiResponse<List<OrganizationSummaryResponse>>`) - a third response shape in this one
  controller, alongside the bare page and the enveloped object. Empty for the org just created, which is correct: it
  has no children.
url: "{{orgService}}/api/v1/organizations/{{orgId}}/children"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });console.log('children:', j.data.length);
    language: text/javascript
order: 5000
