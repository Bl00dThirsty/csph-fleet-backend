$kind: http-request
name: GET :8082/api/v1/classifications  (no headers - bypass)
description: |-
  **organization-service on :8082**, no security headers, so `CLASS_VIEW` is bypassed.

  Enveloped **array**. Read-only reference data - `ClassStructureController` declares a single `GET` and no write
  method, so there is no create step for it in either collection.
url: "{{orgService}}/api/v1/classifications"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 8000
