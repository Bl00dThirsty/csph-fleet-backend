$kind: http-request
name: GET :8085/api/v1/notification-templates  (no headers - bypass)
description: |-
  **notification-service on :8085**, no security headers.

  The whole template catalogue. Enveloped **array** - never paged, because the catalogue is small and static.

  `language` is part of the template, so a French and an English variant are two distinct rows with two distinct
  codes. This list is the place to check whether a translation actually exists before chasing a "wrong language
  notification" report.
url: "{{notifService}}/api/v1/notification-templates"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array', function () { pm.expect(j.data).to.be.an('array'); });
    language: text/javascript
order: 2000
