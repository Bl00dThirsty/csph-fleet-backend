$kind: http-request
name: GET :8084/api/v1/audit/status-history  (no headers - bypass)
description: |-
  **audit-service on :8084**, no security headers, so the audit read check is bypassed.

  The status-change journal: who moved which entity from which status to which, and when. Same
  `AuditQueryParams` binding as `/modifications`, kept separate because status transitions are what regulators ask for
  by name and are indexed differently.
url: "{{auditService}}/api/v1/audit/status-history?page=0&size=20"
method: GET
headers:
  Content-Type: application/json
queryParams:
  page: "0"
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 2000
