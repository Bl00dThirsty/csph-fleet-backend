$kind: http-request
name: GET :8084/api/v1/audit/modifications  (no headers - bypass)
description: |-
  **audit-service on :8084**, no security headers, so the audit read check is bypassed.

  Field-level change history. Enveloped `ApiResponse<PageResponse<EntityModificationResponse>>`. Filters are bound
  through an `AuditQueryParams` `@ModelAttribute`: `entityType`, `entityId`, `actorPersonId`, `action`, `module`,
  `dateFrom`, `dateTo`, `page`, `size`.

  A row is one entity modification whose nested `changes` list holds the individual before/after field pairs - the
  granularity a GPL audit actually requires.
url: "{{auditService}}/api/v1/audit/modifications?entityType=ORGANIZATION&entityId={{orgId}}&page=0&size=20"
method: GET
headers:
  Content-Type: application/json
queryParams:
  entityType: ORGANIZATION
  entityId: "{{orgId}}"
  page: "0"
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 1000
