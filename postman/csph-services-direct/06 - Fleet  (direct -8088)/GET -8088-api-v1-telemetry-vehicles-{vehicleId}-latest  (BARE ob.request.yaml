$kind: http-request
name: GET :8088/api/v1/telemetry/vehicles/{vehicleId}/latest  (BARE object)
description: |-
  **fleet-device-service on :8088**, no security headers, so `TELEMETRY_VIEW` is bypassed.

  **The response is a BARE object, not an `ApiResponse` envelope** - `ResponseEntity<TelemetryResponse>` rather than
  `ResponseEntity<ApiResponse<TelemetryResponse>>`. There is no `success` key and no `data` wrapper; the position
  fields sit at the top level.

  Three adjacent endpoints, three different response conventions. Worth knowing before writing a client against this
  controller.
url: "{{fleetService}}/api/v1/telemetry/vehicles/{{vehicleId}}/latest"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK - permission check was bypassed', function () { pm.expect(pm.response.code).to.eql(200); });
      const t = pm.response.json();
      pm.test('BARE object - no success envelope, no data wrapper', function () {
          pm.expect(t).to.be.an('object');
          pm.expect(t).to.not.have.property('success');
          pm.expect(t).to.not.have.property('data');
      });
      pm.test('position fields at the top level', function () {
          pm.expect(t).to.have.property('vehicleId');
          pm.expect(t).to.have.property('latitude');
          pm.expect(t).to.have.property('longitude');
      });
    language: text/javascript
order: 9000
