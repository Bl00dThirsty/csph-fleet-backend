$kind: http-request
name: POST :8088/api/v1/devices/{deviceId}/assign  (the domain action)
description: |-
  **fleet-device-service on :8088**, no security headers - `fleet.devices.write` is bypassed.

  Assigns the device to a driver **and** a truck in one call, which is the real-world pairing: a handheld rides in a
  specific truck with a specific person. `AssignDeviceRequest` has no `@NotBlank`, so assigning to nobody is legal
  (if useless).

  The counterpart `POST /devices/{id}/unassign` takes **no body at all** - the server nulls both columns itself, so
  sending `{"assignedToPersonId": null}` is unnecessary and ignored.
url: "{{fleetService}}/api/v1/devices/{{deviceId}}/assign"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "assignedToPersonId": "{{personId}}",
      "assignedToVehicleId": "{{vehicleId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('assigned to the vehicle', function () {
          pm.expect(j.data.assignedToVehicleId).to.eql(pm.collectionVariables.get('vehicleId'));
      });
    language: text/javascript
order: 7000
