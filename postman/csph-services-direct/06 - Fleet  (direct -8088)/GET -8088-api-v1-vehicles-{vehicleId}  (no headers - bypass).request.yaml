$kind: http-request
name: GET :8088/api/v1/vehicles/{vehicleId}  (no headers - bypass)
description: |-
  **fleet-device-service on :8088**, no security headers, so `fleet.vehicles.read` is bypassed.

  `certificateExpiryAt` is the compliance field: an expired certificate is what a CSPH inspection actually checks, and
  the platform surfaces it here rather than only in a report.
url: "{{fleetService}}/api/v1/vehicles/{{vehicleId}}"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('id matches the path variable', function () { pm.expect(j.data.id).to.eql(pm.collectionVariables.get('vehicleId')); });
    language: text/javascript
order: 3000
