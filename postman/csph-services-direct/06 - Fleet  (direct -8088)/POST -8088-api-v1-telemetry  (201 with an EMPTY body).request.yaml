$kind: http-request
name: POST :8088/api/v1/telemetry  (201 with an EMPTY body)
description: |-
  **fleet-device-service on :8088**, no security headers - `TELEMETRY_INGEST` is bypassed.

  **The response is 201 with a completely EMPTY body** - `ResponseEntity.status(CREATED).build()` with no payload.
  Calling `pm.response.json()` on it throws, so this request deliberately asserts on the status and the emptiness only.
  This is the one place in either collection where a JSON assertion would be wrong.
url: "{{fleetService}}/api/v1/telemetry"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleId": "{{vehicleId}}",
      "latitude": 4.0511,
      "longitude": 9.7679,
      "speed": 42.5,
      "heading": 128.0,
      "batteryLevel": 76.0,
      "timestamp": "{{nowIso}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', function () { pm.expect(pm.response.code).to.eql(201); });
      pm.test('EMPTY body - do not parse JSON here', function () {
          const body = pm.response.text();
          pm.expect(body === '' || body === null, 'telemetry ingest returns no payload').to.eql(true);
      });
    language: text/javascript
order: 8000
