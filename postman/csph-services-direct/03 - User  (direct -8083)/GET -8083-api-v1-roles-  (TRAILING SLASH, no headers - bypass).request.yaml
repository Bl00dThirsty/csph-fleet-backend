$kind: http-request
name: GET :8083/api/v1/roles/  (TRAILING SLASH, no headers - bypass)
description: |-
  **user-service on :8083**, no security headers, so `ROLE_VIEW` is bypassed.

  Enveloped **array**, not a `PageResponse` - despite `/persons/` two requests up being a bare page. Different
  controller, different convention, same service.

  Also the place to get a `roleId` if `{{roleId}}` is empty: copy any `data[].id` into the environment variable.
url: "{{userService}}/api/v1/roles/"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK - permission check was bypassed', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an array (NOT a PageResponse)', function () { pm.expect(j.data).to.be.an('array'); });
      console.log('roles:', j.data.map(function (r) { return r.code; }).join(', '));
      if (!pm.collectionVariables.get('roleId') && j.data[0]) {
          console.log('roleId is empty - set it to ' + j.data[0].id + ' to enable the role-assignment request.');
      }
    language: text/javascript
order: 9000
