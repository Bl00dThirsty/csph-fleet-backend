$kind: http-request
name: POST :8089/api/v1/declarations/{declarationId}/review?reviewerPersonId=&notes=
description: |-
  **subsidy-service on :8089**, no security headers, so the review check is bypassed.

  A CSPH agent reviews the declaration. Both query parameters are **optional** (`required = false`) - unlike
  `assign-vehicle`, `skip` and `approvedQuantity` elsewhere - but a review with neither reviewer nor notes is useless,
  so both are supplied.

  This is the human checkpoint between the marketer''s claim and the regulator''s decision.
url: "{{subsidyService}}/api/v1/declarations/{{declarationId}}/review?reviewerPersonId={{personId}}&notes=Direct-port%20review%20probe"
method: POST
headers:
  Content-Type: application/json
queryParams:
  reviewerPersonId: "{{personId}}"
  notes: Direct-port%20review%20probe
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('review rejected by the declaration state machine -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 5000
