$kind: http-request
name: GET :8089/api/v1/reconciliations  (no headers - bypass)
description: |-
  **subsidy-service on :8089**, no security headers, so the reconciliation read check is bypassed.

  The regulator''s measured answer to the marketer''s claim. `reconciliations.declaration_id` is `UNIQUE`, so there is
  at most one per declaration - which is why the by-declaration route can 404.
url: "{{subsidyService}}/api/v1/reconciliations?size=20"
method: GET
headers:
  Content-Type: application/json
queryParams:
  size: "20"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      const p = j.data || {};
      pm.test('page metadata present', function () { pm.expect(p).to.have.property('totalCount'); });
      const items = p.content || p.member || [];
      pm.test('content is an array', function () { pm.expect(items).to.be.an('array'); });
    language: text/javascript
order: 6000
