$kind: http-request
name: PATCH :8086/api/v1/pickups/{pickupId}/approve?approvedQuantity=  (REQUIRED param)
description: |-
  **tour-service on :8086**, no security headers - `PICKUP_APPROVE` is bypassed.

  **`approvedQuantity` is a REQUIRED query parameter**, a primitive `double`: omitting it 400s, and so does sending
  anything non-numeric.

  11 against a requested 12 is deliberate - a CSPH agent routinely authorises less than a marketer asks for, and the
  difference is the audit trail the subsidy workflow reconciles later.
url: "{{tourService}}/api/v1/pickups/{{pickupId}}/approve?approvedQuantity=11"
method: PATCH
headers:
  Content-Type: application/json
queryParams:
  approvedQuantity: "11"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('data is an object', function () { pm.expect(j.data).to.be.an('object'); });
      pm.test('accepted, or rejected by the state machine (200, 409, 422)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 409, 422]);
      });
      if (pm.response.code >= 400) {
          console.warn('approve rejected by the pickup state machine -> HTTP ' + pm.response.code);
          console.warn(String(pm.response.text()).slice(0, 300));
      }
    language: text/javascript
order: 11000
