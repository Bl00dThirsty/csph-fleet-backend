$kind: http-request
name: POST :8086/api/v1/tours  (no headers needed)
description: |-
  **tour-service on :8086**, no security headers - `createTour` reads `X-User-Username` with `required = false`, so
  `createdBy` ends up null. That is the honest difference from the gateway collection, where the JWT populates it.

  `CreateTourDto` requires `tourCode`, `marketerOrganizationId`, `executionMode`, `type` and `requestedQuantity`
  (`@NotNull @Positive`). `executionMode` is `INTERNAL` or `EXTERNAL`; `INTERNAL` adds a database constraint that a
  transporter must be assigned, so `EXTERNAL` is used here.
url: "{{tourService}}/api/v1/tours"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tourCode": "DIR-TOUR-{{uniq}}",
      "marketerOrganizationId": "{{marketerOrgId}}",
      "executionMode": "EXTERNAL",
      "type": "VRAC",
      "requestedQuantity": 12.0,
      "transporterOrganizationId": "{{transporterOrgId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200/201 created', function () { pm.expect(pm.response.code).to.be.oneOf([200, 201]); });
      const j = pm.response.json();
      pm.test('envelope success', function () { pm.expect(j.success).to.eql(true); });
      pm.test('tourId captured (UUID)', function () {
          pm.expect(j.data.id).to.match(/^[0-9a-f-]{36}$/i);
          pm.collectionVariables.set('tourId', j.data.id);
      });
    language: text/javascript
order: 3000
