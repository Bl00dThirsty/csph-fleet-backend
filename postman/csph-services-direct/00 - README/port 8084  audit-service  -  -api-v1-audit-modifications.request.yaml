$kind: http-request
name: port 8084  audit-service  ->  /api/v1/audit/modifications
description: |-
  Direct probe of **audit-service** on its own port (8084) - the in-cluster equivalent of
  `http://csph/gpl-audit-service/api/v1/audit/modifications`.

  Sent with **no security headers at all**, which is the point of this collection: `PermissionAspect` finds no
  `GplSecurityContext` and passes the call straight through, so a `200` here proves both that the port is open and
  that the permission check was bypassed.

  - `200` - reachable, and the endpoint is genuinely open (or the check was skipped)
  - `401` - reachable, and the endpoint genuinely requires a caller (`/api/v1/me` without `X-User-PersonId`, for example)
  - `404` - reachable, but that path is not mapped in this service
url: "{{auditService}}/api/v1/audit/modifications"
method: GET
headers:
  Content-Type: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('service answers on port 8084', function () {
          pm.expect(pm.response.code, 'connection refused - the service is not running on 8084').to.be.oneOf([200, 401, 404]);
      });
      console.log('audit-service :' + 8084 + ' -> HTTP ' + pm.response.code);
    language: text/javascript
order: 4000
