  # ── Static seeds only below this line ──────────────────────────────
  # Everything the suite captures at runtime (accessToken, refreshToken,
  # orgId, siteId, tourId, checkpointId, …) lives in COLLECTION variables,
  # set by the request scripts. They MUST NOT appear here: an environment
  # entry — even an empty one — shadows the collection variable of the same
  # name, which is how the whole suite once ran with `Bearer ` (empty) and
  # 401'd from the second request on. If a run needs a pre-seeded id, the
  # capturing request's fallback (items[0]) covers it.
  - key: orgCodeCspHq
    value: CSPH
  - key: orgCodeMktGpl
    value: MKT-GPL
  - key: orgCodeTrpAbc
    value: TRP-ABC
