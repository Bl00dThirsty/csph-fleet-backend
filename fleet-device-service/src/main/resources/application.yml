server:
  port: 8088

spring:
  application:
    name: fleet-device-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/gpl_fleet_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # Hibernate 6 renamed the PostGIS dialects. There is no
        # org.hibernate.spatial.dialect.postgis.PostgisDialect in hibernate-spatial
        # 6.x (that was the Hibernate 5 name), so pointing at it made every pod
        # die with ClassNotFoundException at startup. PostgisPG10Dialect is the
        # class that actually exists and is the right one for PostgreSQL 10+.
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
